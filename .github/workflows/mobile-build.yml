name: Validate Android and iOS native apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/generate-native-assets.mjs'
      - 'src/nativeLinks.js'
      - 'vite.config.js'
      - '.github/workflows/mobile-build.yml'
permissions:
  contents: read
concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK (unsigned test build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK (API 36)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Generate native Android project and icons
        run: npm run mobile:add:android
      - name: Build debug Android APK for device testing
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Save Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: yds-yokdil-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator compilation (not App Store signed)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show Apple build toolchain
        run: xcodebuild -version
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project and icons
        run: npm run mobile:add:ios
      - name: Compile for iOS Simulator without distribution signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
